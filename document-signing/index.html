<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow,noarchive"><link rel="icon" href="/favicon.svg"><link rel="preload" href="/document-signing/fonts/inter-latin-standard-normal.woff2" as="font" type="font/woff2" crossorigin><link rel="preload" href="/document-signing/fonts/be-vietnam-pro-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin><link rel="stylesheet" href="/document-signing/fonts/fonts.css?v=2"><link rel="stylesheet" href="/document-signing/signing.css?v=2"><title>Sign a document · Wistudi</title></head><body data-mode="guest"><header class="app-header"><span class="brand"><img src="/assets/images/wistudi-logo.png" width="154" height="38" alt="Wistudi"></span><span class="app-context">Document signing</span><span class="private-label"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10V7a5 5 0 0 1 10 0v3M5 10h14v11H5z"/></svg>Private document</span></header>
<div id="globalStatus" class="global-status" role="status" aria-live="polite"></div>
<main id="accessScreen"><section class="access-card"><h1 id="accessTitle">Your document awaits</h1><p id="accessDescription">Opening your private document…</p><form id="accessForm" hidden><label>Six-digit access code<input id="accessCode" class="code-input" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required></label><button id="accessSubmit" class="primary full" type="submit">Open document</button></form><div id="accessError" class="inline-error" role="alert"></div></section></main>
<section id="workbench" hidden><div class="work-top"><div class="work-title"><div><h1 id="workTitle"></h1><div id="workMeta" class="meta"></div></div></div><div class="work-actions"><button id="saveDraft" class="secondary" type="button">Save draft</button></div></div><div class="workspace"><div class="pdf-column">
  <div class="viewer-toolbar" aria-label="PDF controls">
    <div class="page-controls"><button id="prevPage" class="icon-button" type="button" aria-label="Previous page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg></button><input id="pageNumber" type="number" min="1" value="1" aria-label="Page number"><span id="pageTotal" class="page-total"></span><button id="nextPage" class="icon-button" type="button" aria-label="Next page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 6 6 6-6 6"/></svg></button></div>
    <div class="zoom-controls"><button id="zoomOut" class="icon-button" type="button" aria-label="Zoom out">−</button><select id="zoom" aria-label="Zoom"><option value="fit-page">Fit page</option><option value="fit">Fit width</option><option value="0.75">75%</option><option value="1">100%</option><option value="1.25">125%</option><option value="1.5">150%</option><option value="2">200%</option></select><button id="zoomIn" class="icon-button" type="button" aria-label="Zoom in">+</button></div>
    <span id="pageSize" class="page-size"></span><button id="downloadPdf" class="download-button" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M4 16v4h16v-4"/></svg>Download PDF</button>
  </div>
  <div id="pdfScroll" class="pdf-scroll"><div id="pageWrap" class="page-wrap"><canvas id="pdfCanvas"></canvas><div id="fieldLayer" class="field-layer"></div><div id="pageLoading" class="loading-page" role="status">Loading PDF…</div></div></div>
</div><aside id="sidebar" class="sidebar" aria-label="Details and signature controls">
  <div id="sidebarIntro"></div><div id="documentDetails"></div>
  <section id="signatureTools" class="side-section" hidden aria-labelledby="signatureHeading">
    <div class="section-title"><h3 id="signatureHeading">Signature</h3><select id="signatureParty" aria-label="Signature party" hidden></select></div>
    <div class="signature-methods"><button id="drawSignature" type="button" class="secondary">Draw signature</button><button id="uploadSignature" type="button" class="secondary">Upload image</button></div>
    <input id="signatureUpload" type="file" accept="image/png,image/jpeg,image/webp" hidden aria-label="Signature image">
    <img id="signaturePreview" class="signature-preview" alt="Signature preview" hidden>
    <p id="placementPrompt" class="placement-prompt" hidden>Click the PDF to place your signature.</p>
    <div id="signatureStatus" class="inline-error" role="status"></div>
    <button id="useSignature" class="primary full" type="button" hidden>Place signature</button><button id="cancelPlacement" class="text-button full" type="button" hidden>Cancel placement</button><button id="removeSignature" class="text-button full" type="button" hidden>Remove draft signature</button>
  </section>
  <div id="signatureAreas"></div><div id="otherSigners"></div><div id="documentActivity"></div>
</aside></div></section><dialog id="signatureDialog" aria-labelledby="drawHeading"><div class="dialog-head"><h2 id="drawHeading">Draw your signature</h2><button id="closeSignature" class="icon-button" type="button" aria-label="Close signature panel">✕</button></div><div class="dialog-body"><canvas id="drawCanvas" class="draw-canvas" width="1200" height="400" aria-label="Draw your signature"></canvas><div class="draw-tools"><button id="undoStroke" class="text-button" type="button">Undo</button><button id="clearDrawing" class="text-button" type="button">Clear</button></div><div id="drawingError" class="inline-error" role="status"></div></div><div class="dialog-actions"><button id="cancelDrawing" class="secondary" type="button">Cancel</button><button id="acceptDrawing" class="primary" type="button">Use signature</button></div></dialog><script type="module" src="/document-signing/signing.js?v=2"></script></body></html>
