<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wistudi · Room Manager</title><style>
:root{font-family:Inter,system-ui,-apple-system,sans-serif;color:#25233c;background:#f6f5fa}*{box-sizing:border-box}body{margin:0}header{background:#fff;border-bottom:1px solid #e7e5ee;padding:18px clamp(18px,4vw,60px);display:flex;justify-content:space-between;align-items:center}header strong{font-size:19px}main{max-width:1140px;margin:36px auto;padding:0 20px}.card{background:#fff;border:1px solid #e7e5ee;border-radius:18px;padding:24px;box-shadow:0 8px 25px #30234a08}h1{font-size:29px;margin:0 0 8px}p{color:#716d80}label{display:grid;gap:6px;font-weight:600;font-size:13px}input,select,textarea{width:100%;padding:12px;border:1px solid #d9d6e2;border-radius:10px;background:#fff;color:#25233c;font:inherit}button{cursor:pointer;border:0;border-radius:10px;background:#6e42c2;color:white;padding:11px 16px;font-weight:650}button.secondary{background:#f1edf9;color:#56359d}button.danger{background:#fff0f0;color:#a12b3b}button:disabled{opacity:.5;cursor:default}.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:end;margin:24px 0}.toolbar label{min-width:155px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.wide{grid-column:1/-1}.items{display:grid;gap:10px}.item{border:1px solid #e8e5ef;border-radius:12px;padding:14px;display:flex;gap:14px;align-items:center;justify-content:space-between}.item strong{display:block}.item small{color:#76717f}.actions{display:flex;gap:8px;flex-wrap:wrap}#message{min-height:24px;color:#63409e}#login{max-width:450px;margin:12vh auto}#editor{margin-top:20px}a{color:#6035af}@media(max-width:680px){.grid{grid-template-columns:1fr}.item{align-items:flex-start;flex-direction:column}.toolbar label{width:100%}}
</style></head><body><header><strong>Wistudi <span style="color:#6e42c2">Room Manager</span></strong><button id="logout" class="secondary" hidden>Sign out</button></header><main>
<section id="login" class="card"><h1>Manager sign in</h1><p>Use the room management credential configured by your administrator.</p><form id="loginForm"><label>Manager password<input id="password" type="password" autocomplete="current-password" required></label><p><button>Sign in</button></p></form></section>
<section id="dashboard" hidden><h1>Room content</h1><p>Manage presentation, video, gallery and download records. Published content is not yet connected to the public room pages.</p><div class="toolbar"><label>Room<select id="room"><option value="client">Client Room</option><option value="distributor">Distributor Room</option><option value="investor">Investor Room</option></select></label><label>Content type<select id="filter"><option value="">All content</option><option value="presentation">Presentations</option><option value="video">Videos</option><option value="gallery">Gallery</option><option value="document">Downloads</option></select></label><button id="new">Add content</button></div><div class="card"><div id="items" class="items"></div></div>
<form id="editor" class="card" hidden><h2 id="editorTitle">Add content</h2><div class="grid"><label>Type<select id="category"><option value="presentation">Presentation</option><option value="video">Video</option><option value="gallery">Gallery image</option><option value="document">Download</option></select></label><label>Language<select id="locale"><option value="en">English</option><option value="vi">Vietnamese</option></select></label><label class="wide">Title<input id="title" maxlength="180" required></label><label class="wide">Asset URL<input id="asset" placeholder="/client-room/assets/..." required></label><label class="wide">Description<textarea id="description" maxlength="2000" rows="3"></textarea></label><label>Status<select id="status"><option value="draft">Draft</option><option value="published">Published</option><option value="archived">Archived</option></select></label><label>Display order<input id="order" type="number" value="0"></label></div><p class="actions"><button type="submit">Save content</button><button type="button" id="cancel" class="secondary">Cancel</button></p></form></section><p id="message" role="status" aria-live="polite"></p></main>
<script>
const $=id=>document.getElementById(id);let editing=null,records=[];
function message(s){$('message').textContent=s}
async function request(url,options={}){const r=await fetch(url,{credentials:'same-origin',...options});const j=await r.json().catch(()=>({error:'invalid_response'}));if(!r.ok)throw Error(j.error||'request_failed');return j}
async function load(){try{const data=await request('/api/room-management/content?room='+encodeURIComponent($('room').value));records=data.items;$('login').hidden=true;$('dashboard').hidden=false;$('logout').hidden=false;render();message('')}catch(e){$('dashboard').hidden=true;$('login').hidden=false;$('logout').hidden=true;message(e.message)}}
function render(){const items=records.filter(x=>!$('filter').value||x.category===$('filter').value);$('items').replaceChildren();if(!items.length){$('items').textContent='No content records yet.';return}for(const item of items){const row=document.createElement('div');row.className='item';const details=document.createElement('div');const title=document.createElement('strong');title.textContent=item.title;const meta=document.createElement('small');meta.textContent=[item.category,item.locale,item.status].join(' · ');details.append(title,meta);const actions=document.createElement('div');actions.className='actions';const edit=document.createElement('button');edit.className='secondary';edit.textContent='Edit';edit.onclick=()=>openEditor(item);const del=document.createElement('button');del.className='danger';del.textContent='Remove';del.onclick=()=>remove(item);actions.append(edit,del);row.append(details,actions);$('items').append(row)}}
function openEditor(item){editing=item?.id||null;$('editor').hidden=false;$('editorTitle').textContent=item?'Edit content':'Add content';$('category').value=item?.category||'presentation';$('locale').value=item?.locale||'en';$('title').value=item?.title||'';$('asset').value=item?.asset_url||'';$('description').value=item?.description||'';$('status').value=item?.status||'draft';$('order').value=item?.sort_order||0;$('editor').scrollIntoView({behavior:'smooth'})}
async function remove(item){if(!confirm('Remove '+item.title+' from this room?'))return;try{await request('/api/room-management/content?room='+$('room').value+'&id='+encodeURIComponent(item.id),{method:'DELETE'});await load()}catch(e){message(e.message)}}
$('loginForm').onsubmit=async e=>{e.preventDefault();try{await request('/api/room-management/session',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:$('password').value})});$('password').value='';await load()}catch(err){message(err.message)}};
$('logout').onclick=async()=>{await request('/api/room-management/session',{method:'DELETE'}).catch(()=>{});location.reload()};
$('room').onchange=()=>{$('editor').hidden=true;load()};$('filter').onchange=render;$('new').onclick=()=>openEditor(null);$('cancel').onclick=()=>{$('editor').hidden=true};
$('editor').onsubmit=async e=>{e.preventDefault();const body={room_id:$('room').value,category:$('category').value,locale:$('locale').value,title:$('title').value,asset_url:$('asset').value,description:$('description').value,status:$('status').value,sort_order:Number($('order').value)||0};if(editing)body.id=editing;try{await request('/api/room-management/content?room='+$('room').value,{method:editing?'PATCH':'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});$('editor').hidden=true;await load();message('Saved')}catch(err){message(err.message)}};
load();
</script></body></html>
