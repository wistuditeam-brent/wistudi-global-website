<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Wistudi | Client Room</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
:root{color-scheme:dark;--bg:#07080d;--panel:#0f1119;--ink:#f8fafc;--muted:rgba(248,250,252,.66);--soft:rgba(248,250,252,.44);--line:rgba(255,255,255,.13);--purple:#8655ef;--orange:#ff7417;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink)}body{overflow-x:hidden}button,a,input{font:inherit}[hidden]{display:none!important}
.room-header{position:sticky;top:0;z-index:80;height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(18px,3.4vw,56px);border-bottom:1px solid rgba(255,255,255,.1);background:rgba(7,8,13,.96);backdrop-filter:blur(18px)}
.brand-wrap{display:flex;align-items:center;gap:14px;min-width:0}.brand-logo{display:block;width:auto;height:31px;max-width:152px;object-fit:contain}.room-name{padding-left:14px;border-left:1px solid rgba(255,255,255,.16);font-size:.83rem;font-weight:750;color:#c9b9f9;white-space:nowrap}.lang{color:#fff;text-decoration:none;font-size:.8rem;font-weight:650}
.shell{background:radial-gradient(circle at 8% 4%,rgba(116,75,200,.25),transparent 31%),linear-gradient(135deg,#0b0c13,#0c0e16 58%,#07080d);min-height:calc(100vh - 68px)}
.hero{max-width:1180px;margin:0 auto;padding:66px 24px 0}.hero h1{font-size:clamp(2.65rem,5vw,4rem);line-height:1;letter-spacing:-.055em;margin:0 0 16px}.hero p{font-size:1.02rem;line-height:1.65;color:var(--muted);margin:0;max-width:620px}
.tabs-wrap{max-width:1180px;margin:0 auto;padding:30px 24px 0;position:relative;z-index:5}.tabs{display:flex;gap:10px;flex-wrap:wrap}.tab{border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.04);color:#f4f1ff;border-radius:999px;padding:11px 18px;cursor:pointer;transition:.18s ease}.tab:hover{background:rgba(255,255,255,.08)}.tab.selected{background:linear-gradient(135deg,#7947d9,#8f5cf5);border-color:#9f7af6;color:#fff}
.content-shell{max-width:1180px;margin:0 auto;padding:38px 24px 96px}.section-heading{font-size:1.2rem;margin:0 0 26px}.status{min-height:20px;color:var(--muted);font-size:.92rem}.retry,.small-btn{border:1px solid var(--line);background:rgba(255,255,255,.05);color:#fff;border-radius:999px;padding:10px 15px;cursor:pointer}
.presentation-layout,.toc-layout{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:clamp(38px,6vw,90px);align-items:start}.presentation-copy{padding-top:32px}.kicker{text-transform:uppercase;letter-spacing:.16em;font-size:.7rem;font-weight:800;color:var(--soft);margin-bottom:15px}.big-title{font-size:clamp(2.5rem,4.8vw,3.8rem);letter-spacing:-.055em;line-height:1.04;margin:0 0 18px}.copy{color:var(--muted);font-size:1rem;line-height:1.65}.list{display:grid;border-top:1px solid var(--line)}.row{width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:center;padding:27px 0;border:0;border-bottom:1px solid var(--line);background:transparent;color:#fff;text-align:left;cursor:pointer}.row-title{font-size:clamp(1.42rem,2.3vw,2.18rem);font-weight:800;letter-spacing:-.045em;color:rgba(255,255,255,.88)}.row:hover .row-title{color:#fff}.row-note{display:block;margin-top:6px;color:var(--muted);font-size:.91rem;line-height:1.5}.row-meta{font-size:.76rem;color:var(--soft);white-space:nowrap}.chapter-row{grid-template-columns:52px minmax(0,1fr) auto}.chapter-num{color:var(--orange);font-weight:800;font-size:.95rem}.back-btn{display:inline-flex;border:1px solid var(--line);background:rgba(255,255,255,.05);color:#fff;border-radius:999px;padding:10px 15px;cursor:pointer}.start-btn{margin-top:14px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:#fff;border-radius:999px;padding:11px 16px;cursor:pointer;font-weight:700}
.video-grid,.download-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:18px}.media-card{border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.045);overflow:hidden}.media-card video{display:block;width:100%;aspect-ratio:16/9;background:#000}.media-body{padding:20px}.media-body h3{font-size:1rem;margin:0 0 9px}.media-body p{font-size:.9rem;color:var(--muted);line-height:1.55;margin:0}.download-card{display:flex;flex-direction:column;min-height:180px;padding:22px}.download-card .action{margin-top:auto;align-self:flex-start}.action{display:inline-flex;text-decoration:none;color:#fff;background:var(--purple);border-radius:10px;padding:10px 15px;font-weight:700}
.gallery-head{display:grid;grid-template-columns:minmax(0,330px) minmax(0,1fr);gap:36px;margin-bottom:24px}.gallery-head h2{font-size:clamp(2rem,4vw,3.1rem);letter-spacing:-.04em;margin:0 0 10px}.gallery-description p{margin:0 0 10px;color:var(--muted);line-height:1.58}.gallery-description strong{color:#fff}.gallery-tabs{display:flex;gap:9px;flex-wrap:wrap;margin:0 0 30px}.gallery-chip{border:1px solid var(--line);background:rgba(255,255,255,.04);color:#eee;border-radius:999px;padding:9px 14px;cursor:pointer}.gallery-chip.active{background:#fff;color:#0b0c10;border-color:#fff}.gallery-count{font-size:.8rem;color:var(--soft);margin-left:auto;align-self:center}
.gallery-grid{columns:4 220px;column-gap:14px}.gallery-card{display:block;width:100%;margin:0 0 14px;padding:0;border:0;border-radius:14px;overflow:hidden;background:#11131b;cursor:pointer;break-inside:avoid;position:relative}.gallery-card img{display:block;width:100%;height:auto;min-height:120px;object-fit:cover;transition:transform .25s ease}.gallery-card:hover img{transform:scale(1.018)}.gallery-caption{position:absolute;left:0;right:0;bottom:0;padding:34px 12px 11px;background:linear-gradient(transparent,rgba(0,0,0,.75));font-size:.76rem;color:#fff;text-align:left;opacity:0;transition:.18s}.gallery-card:hover .gallery-caption{opacity:1}
.lightbox{position:fixed;inset:0;z-index:120;background:rgba(4,5,9,.95);display:grid;place-items:center;padding:32px}.lightbox figure{margin:0;max-width:min(1180px,94vw);max-height:92vh;display:grid;gap:12px}.lightbox img{max-width:100%;max-height:82vh;object-fit:contain;border-radius:10px}.lightbox figcaption{color:#d8d4df;text-align:center;font-size:.86rem}.lightbox-close{position:absolute;top:18px;right:22px;width:42px;height:42px;border-radius:999px;border:1px solid var(--line);background:#151721;color:#fff;font-size:1.4rem;cursor:pointer}
.slide-shell{position:fixed;z-index:70;inset:68px 0 0;background:#06070b}.slide-top{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(14px,2.5vw,32px);border-bottom:1px solid var(--line);background:rgba(7,8,13,.95)}.slide-left{display:flex;align-items:center;gap:12px;min-width:0}.slide-title{font-size:.82rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.slide-stage{position:absolute;inset:58px 0 44px;display:grid;place-items:center;padding:16px 62px}.slide-stage canvas{max-width:100%;max-height:100%;box-shadow:0 24px 70px rgba(0,0,0,.46)}.slide-nav{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:58px;border:0;background:transparent;color:rgba(255,255,255,.55);font-size:2.9rem;cursor:pointer;z-index:2}.slide-nav:hover{color:#fff}.slide-prev{left:10px}.slide-next{right:10px}.slide-bottom{position:absolute;left:0;right:0;bottom:0;height:44px;display:flex;justify-content:center;align-items:center}.progress-wrap{width:min(520px,58vw);display:flex;align-items:center;gap:12px}.progress{height:2px;flex:1;background:rgba(255,255,255,.18)}.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--orange),var(--purple));width:0}.slide-count{font-size:.76rem;color:var(--muted)}.loading{display:flex;gap:10px;align-items:center;color:var(--muted)}.spinner{width:18px;height:18px;border-radius:50%;border:2px solid rgba(255,255,255,.2);border-top-color:#fff;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.slide-error{color:var(--muted);max-width:520px;text-align:center}
@media(max-width:850px){.presentation-layout,.toc-layout,.gallery-head{grid-template-columns:1fr}.presentation-copy{padding-top:0}.row-title{font-size:1.35rem}.gallery-grid{columns:2 150px}.slide-stage{padding:12px 38px}.room-name{display:none}}
</style>
</head>
<body>
<header class="room-header">
  <div class="brand-wrap"><img class="brand-logo" src="/assets/images/wistudi-logo.png" alt="Wistudi"><span class="room-name" id="roomName">Client Room</span></div>
  <a class="lang" id="language" href="/client-room/vi/">Tiếng Việt</a>
</header>
<div class="shell">
  <section class="hero" id="hero"><h1 id="heroTitle">Client Room</h1><p id="intro"></p></section>
  <div class="tabs-wrap" id="tabsWrap"><nav class="tabs" id="tabs" aria-label="Client Room"></nav></div>
  <main class="content-shell"><h2 class="section-heading" id="heading"></h2><p class="status" id="status" role="status" aria-live="polite"></p><div id="content"></div></main>
</div>
<div class="slide-shell" id="slideShell" hidden>
  <div class="slide-top"><div class="slide-left"><button class="small-btn" id="backContents">← Contents</button><span class="slide-title" id="slideTitle"></span></div><button class="small-btn" id="fullScreen">⛶</button></div>
  <button class="slide-nav slide-prev" id="prevSlide" aria-label="Previous slide">‹</button>
  <button class="slide-nav slide-next" id="nextSlide" aria-label="Next slide">›</button>
  <div class="slide-stage"><div class="loading" id="slideLoading"><span class="spinner"></span><span>Loading presentation…</span></div><canvas id="slideCanvas" hidden></canvas><div class="slide-error" id="slideError" hidden></div></div>
  <div class="slide-bottom"><div class="progress-wrap"><div class="progress"><span id="slideProgress"></span></div><span class="slide-count" id="slideCount"></span></div></div>
</div>
<div class="lightbox" id="lightbox" hidden><button class="lightbox-close" id="lightboxClose" aria-label="Close">×</button><figure><img id="lightboxImage" alt=""><figcaption id="lightboxCaption"></figcaption></figure></div>
<script type="module" src="/client-room/cms.js"></script>
</body>
</html>
