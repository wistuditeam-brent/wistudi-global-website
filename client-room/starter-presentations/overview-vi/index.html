<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tổng quan Wistudi</title><style>
*{box-sizing:border-box}body{margin:0;background:#090a11;color:#fff;font-family:Inter,system-ui,sans-serif}header{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid #ffffff20}.controls{display:flex;gap:8px;align-items:center}button,a{border:1px solid #ffffff28;background:#ffffff0c;color:#fff;border-radius:9px;padding:9px 13px;text-decoration:none;font:inherit;cursor:pointer}main{height:calc(100vh - 64px);display:grid;place-items:center;padding:16px}iframe{width:min(1100px,100%);height:100%;border:0;background:#fff;border-radius:10px}span{color:#aaa4b8;font-size:13px}</style></head><body><header><strong>Tổng quan Wistudi</strong><div class="controls"><button id="prev">←</button><span id="count"></span><button id="next">→</button><a href="/client-room/">Client Room</a></div></header><main><iframe id="frame" title="Tổng quan Wistudi"></iframe></main><script>let n=1;const total=13,base="/client-room/starter-assets/vi/assets/presentation/overview-vi-pages/";const f=document.getElementById('frame'),c=document.getElementById('count');function show(){f.src=base+'slide-'+String(n).padStart(2,'0')+'.pdf';c.textContent=n+' / '+total;prev.disabled=n===1;next.disabled=n===total}prev.onclick=()=>{if(n>1){n--;show()}};next.onclick=()=>{if(n<total){n++;show()}};show()</script></body></html>
