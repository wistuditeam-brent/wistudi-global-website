<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Wistudi | Contact</title><style>:root{color-scheme:dark;--bg:#07080d;--ink:#f8fafc;--muted:rgba(248,250,252,.66);--soft:rgba(248,250,252,.44);--line:rgba(255,255,255,.13);--purple:#8655ef;--orange:#ff7417;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink)}body{overflow-x:hidden}a{color:inherit}.room-header{position:sticky;top:0;z-index:80;height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(18px,3.4vw,56px);border-bottom:1px solid rgba(255,255,255,.1);background:rgba(7,8,13,.96);backdrop-filter:blur(18px)}.brand-wrap{display:flex;align-items:center;gap:14px;min-width:0;text-decoration:none}.brand-logo{display:block;width:auto;height:31px;max-width:152px;object-fit:contain}.room-name{padding-left:14px;border-left:1px solid rgba(255,255,255,.16);font-size:.83rem;font-weight:750;color:#c9b9f9;white-space:nowrap}.header-actions{display:flex;align-items:center;gap:10px}.header-link{color:#eee;text-decoration:none;font-size:.78rem;font-weight:650;padding:9px 10px;border-radius:9px}.header-link:hover,.header-link.active{background:rgba(255,255,255,.07)}.header-icon{display:grid;place-items:center;width:38px;height:38px;border:1px solid var(--line);border-radius:10px;color:#fff;text-decoration:none}.header-icon svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8}.signin{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;background:linear-gradient(135deg,#7444d0,#925ef7);color:#fff;border-radius:10px;padding:10px 15px;font-size:.78rem;font-weight:750}.language-menu{position:relative}.language-menu summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:.76rem;font-weight:700}.language-menu summary::-webkit-details-marker{display:none}.language-pop{position:absolute;right:0;top:46px;min-width:155px;padding:7px;background:#151720;border:1px solid var(--line);border-radius:12px;box-shadow:0 20px 45px rgba(0,0,0,.36)}.language-pop a{display:flex;align-items:center;gap:9px;color:#fff;text-decoration:none;padding:9px;border-radius:8px;font-size:.78rem}.language-pop a:hover{background:rgba(255,255,255,.07)}.flag{width:23px;height:15px;border-radius:2px;overflow:hidden;display:inline-flex}.flag svg{width:100%;height:100%;display:block}.shell{min-height:calc(100vh - 68px);background:radial-gradient(circle at 8% 4%,rgba(116,75,200,.22),transparent 32%),linear-gradient(135deg,#0b0c13,#0c0e16 60%,#07080d)}.container{width:min(calc(100% - 40px),1180px);margin-inline:auto}.kicker{text-transform:uppercase;letter-spacing:.16em;font-size:.7rem;font-weight:800;color:var(--soft)}.muted{color:var(--muted)}.back{display:inline-flex;text-decoration:none;color:#ddd;font-size:.8rem;margin-bottom:22px}.tags{display:flex;gap:7px;flex-wrap:wrap}.tag{display:inline-flex;padding:6px 9px;border:1px solid var(--line);border-radius:999px;font-size:.7rem;color:#d8d4e2}@media(max-width:700px){.header-link{display:none}.room-name{display:none}.header-actions{gap:6px}.signin{padding:9px 11px}.room-header{padding-inline:14px}.language-menu summary span.label{display:none}.brand-logo{height:27px;max-width:130px}}
.contact{padding:70px 0 100px}.contact-hero{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:70px}.contact h1{font-size:clamp(3rem,5.5vw,5rem);letter-spacing:-.06em;line-height:1;margin:12px 0 20px}.lead{font-size:1.04rem;line-height:1.75;color:var(--muted)}.contact-grid{display:grid;gap:12px}.contact-card{padding:20px;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.035)}.contact-card .label{font-size:.7rem;text-transform:uppercase;letter-spacing:.12em;color:var(--soft);margin-bottom:7px}.contact-card a,.contact-card .value{font-size:1rem;color:#fff;text-decoration:none;line-height:1.5}.people{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:46px}.person{padding:18px;border:1px solid var(--line);border-radius:15px;background:rgba(255,255,255,.03)}.person h3{margin:0 0 5px}.person p{margin:3px 0;color:var(--muted);font-size:.86rem}.socials{display:flex;gap:16px;flex-wrap:wrap;margin-top:28px}.socials a{font-weight:700;text-decoration:none;border-bottom:1px solid currentColor}.status{color:var(--muted)}@media(max-width:800px){.contact-hero{grid-template-columns:1fr;gap:38px}}</style></head><body><header class="room-header"><a class="brand-wrap" href="/client-room/"><img class="brand-logo" src="/assets/images/wistudi-logo-client.svg" alt="Wistudi"><span class="room-name">Client Room</span></a><div class="header-actions">
