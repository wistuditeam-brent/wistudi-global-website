<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Wistudi | Investor Presentation 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#f8fafc;--muted:rgba(248,250,252,.64);--soft:rgba(248,250,252,.42);--line:rgba(255,255,255,.13);--dark:#07080d;--orange:#ff7417;--purple:#8b5cf6;--blue:#0ea5e9}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--dark);color:var(--ink);font-family:Inter,Arial,sans-serif;line-height:1.5;overflow:hidden;-webkit-font-smoothing:antialiased}button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}.screen{position:fixed;inset:0;display:none}.screen.active{display:block}
.intro{background:radial-gradient(ellipse at 0% 0%,rgba(245,32,139,.92),transparent 42%),radial-gradient(ellipse at 100% 100%,rgba(8,223,226,.92),transparent 48%),linear-gradient(135deg,#9d18d4 0%,#3335ef 49%,#00a9ee 100%)}.intro:before{content:"";position:absolute;right:-50px;top:-130px;width:330px;height:1050px;opacity:.35;background:repeating-radial-gradient(ellipse at center,rgba(255,255,255,.75) 0 2px,transparent 3px 17px);border-radius:50%;transform:rotate(4deg)}.intro:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.02),rgba(0,0,0,.24));pointer-events:none}.intro-center{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:32px;z-index:1}.intro-stack{transform:translateY(14px);opacity:0;animation:riseIn .95s cubic-bezier(.2,.8,.2,1) forwards}.wordmark{font-family:"Be Vietnam Pro",Inter,sans-serif;font-weight:800;letter-spacing:-.085em;font-size:clamp(4.8rem,14vw,11rem);line-height:.82;filter:drop-shadow(0 28px 56px rgba(0,0,0,.28))}.wordmark .wi{color:var(--orange)}.wordmark .studi{color:#fff}.intro-title{font-family:"Be Vietnam Pro",Inter,sans-serif;font-size:clamp(1.05rem,2.2vw,1.55rem);font-weight:600;letter-spacing:.01em;margin:36px 0 28px;color:rgba(255,255,255,.92)}.enter-btn{min-width:190px;height:48px;border:1px solid rgba(255,255,255,.34);border-radius:999px;background:rgba(8,10,18,.26);backdrop-filter:blur(18px);font-weight:600;font-size:.9rem;letter-spacing:.01em;box-shadow:0 18px 46px rgba(0,0,0,.20);opacity:0;animation:fadeIn .65s ease .55s forwards}.enter-btn:hover{background:rgba(255,255,255,.13);border-color:rgba(255,255,255,.54);transform:translateY(-1px)}@keyframes riseIn{to{opacity:1;transform:translateY(0)}}@keyframes fadeIn{to{opacity:1}}
.toc-screen{background:radial-gradient(circle at 12% 8%,rgba(139,92,246,.20),transparent 30%),linear-gradient(135deg,#090a10,#10121b 55%,#090a10)}.toc-inner{height:100%;display:grid;grid-template-columns:minmax(260px,420px) minmax(0,1fr);gap:clamp(36px,8vw,120px);align-items:center;padding:clamp(28px,6vw,80px)}.toc-kicker{font-size:.74rem;letter-spacing:.16em;text-transform:uppercase;color:var(--soft);font-weight:700;margin-bottom:16px}.toc-title{font-family:"Be Vietnam Pro",Inter,sans-serif;font-size:clamp(2.4rem,5.2vw,5.6rem);line-height:.96;letter-spacing:-.055em;margin:0 0 20px}.toc-copy{max-width:420px;color:var(--muted);font-size:clamp(.94rem,1.45vw,1.08rem)}.toc-actions{display:flex;gap:10px;margin-top:34px;flex-wrap:wrap}.text-btn{height:42px;padding:0 2px;border-bottom:1px solid rgba(255,255,255,.24);font-weight:600;color:rgba(255,255,255,.86)}.text-btn:hover{color:white;border-color:white}.chapter-list{display:grid;gap:0;border-top:1px solid var(--line)}.chapter-row{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:18px;align-items:center;padding:24px 0;border-bottom:1px solid var(--line);text-align:left;width:100%}.chapter-row:hover .chapter-name,.chapter-row:focus-visible .chapter-name{color:white}.chapter-num{font-family:"Be Vietnam Pro";font-weight:700;color:var(--orange);font-size:.95rem}.chapter-name{font-family:"Be Vietnam Pro";font-size:clamp(1.24rem,2.1vw,2rem);font-weight:700;letter-spacing:-.04em;color:rgba(255,255,255,.82);transition:.18s ease}.chapter-note{display:block;margin-top:3px;font-family:Inter;font-size:.86rem;font-weight:500;letter-spacing:0;color:var(--muted)}.chapter-slides{font-size:.78rem;color:var(--soft);white-space:nowrap}
.viewer{background:#07080d}.viewer-top{position:absolute;left:0;right:0;top:0;height:64px;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(14px,2.7vw,34px);background:linear-gradient(180deg,rgba(7,8,13,.88),rgba(7,8,13,0));transition:opacity .2s ease}.viewer-brand{font-family:"Be Vietnam Pro";font-weight:700;letter-spacing:-.035em;font-size:1rem}.viewer-title{font-size:.82rem;color:var(--muted);margin-left:14px}.viewer-left,.viewer-controls{display:flex;align-items:center;gap:14px}.icon-btn,.word-btn,.platform-btn{height:38px;border-radius:999px;color:rgba(255,255,255,.82)}.icon-btn{width:38px;display:grid;place-items:center;border:1px solid transparent;text-decoration:none}.icon-btn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.7}.word-btn{padding:0 12px;font-size:.82rem;font-weight:600;border:1px solid transparent}.platform-btn{display:inline-flex;align-items:center;padding:0 15px;text-decoration:none;font-size:.8rem;font-weight:650;background:#fff;color:#0b0c10;border:1px solid rgba(255,255,255,.9);transition:.18s ease}.platform-btn:hover{background:#f3f4f6;transform:translateY(-1px)}.icon-btn:hover,.word-btn:hover{background:rgba(255,255,255,.08);color:white;border-color:rgba(255,255,255,.13)}.stage{position:absolute;inset:56px 0 54px;display:grid;place-items:center;padding:clamp(8px,2vw,24px)}.slide-shell{position:relative;display:grid;place-items:center;width:100%;height:100%}canvas{max-width:100%;max-height:100%;width:auto;height:auto;display:block;background:white;box-shadow:0 28px 90px rgba(0,0,0,.46)}.loading{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:.86rem;color:var(--muted);letter-spacing:.02em}.nav-hit{position:absolute;top:64px;bottom:54px;width:20vw;z-index:12;display:grid;place-items:center;color:rgba(255,255,255,.38);font-size:48px;transition:.18s ease}.nav-hit:hover{color:rgba(255,255,255,.82)}.nav-prev{left:0}.nav-next{right:0}.viewer-bottom{position:absolute;left:0;right:0;bottom:0;height:56px;z-index:20;display:grid;place-items:center;padding:0 clamp(14px,3vw,40px);background:linear-gradient(0deg,rgba(7,8,13,.9),rgba(7,8,13,0));transition:opacity .2s ease}.progress-wrap{width:min(520px,54vw);display:flex;align-items:center;gap:14px}.progress{height:2px;flex:1;background:rgba(255,255,255,.18);overflow:hidden}.progress span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--orange),var(--purple));transition:width .22s ease}.slide-count{font-size:.78rem;color:var(--muted);white-space:nowrap;font-weight:600}.drawer{position:absolute;inset:0;z-index:40;pointer-events:none}.drawer.open{pointer-events:auto}.drawer-scrim{position:absolute;inset:0;background:rgba(0,0,0,0);transition:.18s ease}.drawer.open .drawer-scrim{background:rgba(0,0,0,.48)}.drawer-panel{position:absolute;left:0;top:0;bottom:0;width:min(390px,92vw);background:rgba(13,15,23,.96);border-right:1px solid var(--line);transform:translateX(-100%);transition:transform .24s cubic-bezier(.2,.8,.2,1);padding:28px 26px;backdrop-filter:blur(18px)}.drawer.open .drawer-panel{transform:translateX(0)}.drawer-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:30px}.drawer-label{font-size:.72rem;text-transform:uppercase;letter-spacing:.16em;color:var(--soft);font-weight:700}.drawer-list{display:grid;gap:0;border-top:1px solid var(--line)}.drawer-item{display:grid;grid-template-columns:38px 1fr;gap:14px;align-items:center;text-align:left;padding:18px 0;border-bottom:1px solid var(--line);color:rgba(255,255,255,.72)}.drawer-item.active{color:white}.drawer-item.active .drawer-index{color:var(--orange)}.drawer-index{font-family:"Be Vietnam Pro";font-weight:700;color:rgba(255,255,255,.38)}.drawer-name{font-family:"Be Vietnam Pro";font-weight:700;letter-spacing:-.035em}.drawer-note{display:block;font-family:Inter;font-size:.76rem;color:var(--muted);font-weight:500;letter-spacing:0;margin-top:2px}.rotate-tip{position:absolute;left:50%;bottom:72px;transform:translateX(-50%);z-index:30;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:rgba(12,13,18,.76);color:rgba(255,255,255,.72);font-size:.75rem;opacity:0;pointer-events:none;transition:.25s ease;backdrop-filter:blur(14px)}.rotate-tip.show{opacity:1}.error-box{max-width:560px;text-align:center;color:var(--muted)}.error-box a{color:white;border-bottom:1px solid rgba(255,255,255,.4)}.viewer.idle.fullscreen-active .viewer-top,.viewer.idle.fullscreen-active .viewer-bottom{opacity:0}
@media (max-width:800px){.intro:before{width:220px;right:-78px}.wordmark{font-size:clamp(4rem,19vw,7rem)}.toc-inner{display:block;overflow:auto;padding:34px 22px 80px}.toc-copy{max-width:680px}.chapter-list{margin-top:38px}.chapter-row{grid-template-columns:44px 1fr;gap:14px;padding:20px 0}.chapter-slides{grid-column:2;font-size:.75rem;margin-top:-8px}.viewer-title{display:none}.viewer-top{height:56px}.word-btn{padding:0 8px}.stage{inset:50px 0 50px;padding:6px}.progress-wrap{width:72vw}.nav-hit{display:none}}@media (max-width:540px){.viewer-brand{font-size:.92rem}.viewer-left,.viewer-controls{gap:6px}.word-btn{font-size:.78rem}.platform-btn{height:34px;padding:0 11px;font-size:.72rem}.icon-btn{width:34px;height:34px}.website-btn{display:none}.progress-wrap{width:80vw}.drawer-panel{padding:24px 20px}}
</style>
</head>
<body>
<section class="screen intro active" id="intro"><div class="intro-center"><div class="intro-stack"><div class="wordmark" aria-label="Wistudi"><span class="wi">Wi</span><span class="studi">studi</span></div><div class="intro-title">Investor Presentation 2026</div><button class="enter-btn" id="enterBtn" type="button">View presentation</button></div></div></section>
<section class="screen toc-screen" id="tocScreen"><div class="toc-inner"><div><div class="toc-kicker">Private materials</div><h1 class="toc-title">Investor Presentation 2026</h1><p class="toc-copy">Use the contents to move through the deck by section, or start from the beginning.</p><div class="toc-actions"><button class="text-btn" id="startDeck" type="button">Start from slide 1</button></div></div><div class="chapter-list" id="chapterList"></div></div></section>
<main class="screen viewer" id="viewer"><div class="viewer-top"><div class="viewer-left"><span class="viewer-brand">Wistudi</span><span class="viewer-title">Investor Presentation 2026</span></div><div class="viewer-controls"><a class="platform-btn" href="https://wistudi.com/sign-in" target="_blank" rel="noopener">Open Wistudi</a><a class="icon-btn website-btn" href="https://global.wistudi.com" target="_blank" rel="noopener" aria-label="Visit Wistudi website" title="Visit Wistudi website"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M3.6 9h16.8M3.6 15h16.8M12 3c2.2 2.4 3.3 5.4 3.3 9S14.2 18.6 12 21M12 3C9.8 5.4 8.7 8.4 8.7 12S9.8 18.6 12 21"></path></svg></a><button class="word-btn" id="contentsBtn" type="button">Contents</button><button class="icon-btn" id="fullscreenBtn" type="button" aria-label="Fullscreen">⛶</button></div></div><button class="nav-hit nav-prev" id="prevHit" type="button" aria-label="Previous slide">‹</button><button class="nav-hit nav-next" id="nextHit" type="button" aria-label="Next slide">›</button><div class="stage"><div class="slide-shell"><div class="loading" id="loading">Preparing presentation...</div><canvas id="slideCanvas"></canvas><div class="error-box" id="errorBox" hidden></div></div></div><div class="viewer-bottom"><div class="progress-wrap"><div class="progress"><span id="progressBar"></span></div><div class="slide-count" id="slideCount">1 / 16</div></div></div><aside class="drawer" id="drawer" aria-hidden="true"><div class="drawer-scrim" id="drawerScrim"></div><div class="drawer-panel"><div class="drawer-head"><div class="drawer-label">Contents</div><button class="icon-btn" id="closeDrawer" type="button" aria-label="Close contents">×</button></div><div class="drawer-list" id="drawerList"></div></div></aside><div class="rotate-tip" id="rotateTip">Rotate your device for a larger view.</div></main>
<script type="module">
import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs';
const pdfUrl='./assets/presentation/investor-partnership-2026-optimized.pdf';
const chapters=[{num:'01',name:'Wistudi overview',note:'Team, platform and publishing layer',slide:1,range:'Slides 1-4'},{num:'02',name:'Learning is fragmented',note:'The problem Wistudi is built around',slide:5,range:'Slide 5'},{num:'03',name:'Product system',note:'Modular learning, XP Video and printable learning',slide:6,range:'Slides 6-9'},{num:'04',name:'Validation and market',note:'Product foundation, pilots and ecosystem direction',slide:10,range:'Slides 10-11'},{num:'05',name:'Market validation & routes',note:'Educator feedback, pilots and three routes to market',slide:12,range:'Slides 12-13'},{num:'06',name:'Commercial model & growth',note:'Business model, partner-led scale, traction and revenue layers',slide:14,range:'Slides 14-17'}];
const intro=document.getElementById('intro'),tocScreen=document.getElementById('tocScreen'),viewer=document.getElementById('viewer'),canvas=document.getElementById('slideCanvas'),ctx=canvas.getContext('2d'),loading=document.getElementById('loading'),errorBox=document.getElementById('errorBox'),progressBar=document.getElementById('progressBar'),slideCount=document.getElementById('slideCount'),drawer=document.getElementById('drawer'),rotateTip=document.getElementById('rotateTip');let pdfDoc=null,currentPage=1,totalPages=17,rendering=false,queuedPage=null,idleTimer=null;
function setScreen(target){[intro,tocScreen,viewer].forEach(s=>s.classList.remove('active'));target.classList.add('active')}function createChapterButton(ch,compact=false){const btn=document.createElement('button');btn.type='button';btn.className=compact?'drawer-item':'chapter-row';btn.dataset.slide=ch.slide;btn.innerHTML=compact?`<span class="drawer-index">${ch.num}</span><span><span class="drawer-name">${ch.name}</span><span class="drawer-note">${ch.note}</span></span>`:`<span class="chapter-num">${ch.num}</span><span><span class="chapter-name">${ch.name}</span><span class="chapter-note">${ch.note}</span></span><span class="chapter-slides">${ch.range}</span>`;btn.addEventListener('click',()=>openSlide(ch.slide));return btn}chapters.forEach(ch=>{document.getElementById('chapterList').appendChild(createChapterButton(ch));document.getElementById('drawerList').appendChild(createChapterButton(ch,true))});
document.getElementById('enterBtn').addEventListener('click',()=>setScreen(tocScreen));document.getElementById('startDeck').addEventListener('click',()=>openSlide(1));document.getElementById('contentsBtn').addEventListener('click',openDrawer);document.getElementById('closeDrawer').addEventListener('click',closeDrawer);document.getElementById('drawerScrim').addEventListener('click',closeDrawer);document.getElementById('prevHit').addEventListener('click',()=>go(-1));document.getElementById('nextHit').addEventListener('click',()=>go(1));document.getElementById('fullscreenBtn').addEventListener('click',toggleFullscreen);
function openDrawer(){drawer.classList.add('open');drawer.setAttribute('aria-hidden','false');updateDrawerState()}function closeDrawer(){drawer.classList.remove('open');drawer.setAttribute('aria-hidden','true')}function activeChapter(){return chapters.slice().reverse().find(ch=>currentPage>=ch.slide)||chapters[0]}function updateDrawerState(){const active=activeChapter();document.querySelectorAll('.drawer-item').forEach(item=>item.classList.toggle('active',Number(item.dataset.slide)===active.slide))}
async function loadPdf(){if(pdfDoc)return pdfDoc;try{pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs';pdfDoc=await pdfjsLib.getDocument({url:pdfUrl}).promise;totalPages=pdfDoc.numPages;return pdfDoc}catch(err){loading.hidden=true;canvas.style.display='none';errorBox.hidden=false;errorBox.innerHTML=`The presentation could not be loaded here.<br><a href="${pdfUrl}" target="_blank" rel="noopener">Open the PDF directly</a>`;throw err}}
async function openSlide(page){closeDrawer();setScreen(viewer);currentPage=Math.max(1,Math.min(page,totalPages));await loadPdf();await renderPage(currentPage);maybeShowRotateTip();resetIdle()}async function renderPage(pageNum){if(rendering){queuedPage=pageNum;return}rendering=true;loading.hidden=false;const page=await pdfDoc.getPage(pageNum);const stage=document.querySelector('.stage');const base=page.getViewport({scale:1});const availableW=Math.max(260,stage.clientWidth-24);const availableH=Math.max(180,stage.clientHeight-20);const cssScale=Math.min(availableW/base.width,availableH/base.height);const dpr=Math.min(window.devicePixelRatio||1,2);const viewport=page.getViewport({scale:cssScale*dpr});canvas.width=Math.floor(viewport.width);canvas.height=Math.floor(viewport.height);canvas.style.width=Math.floor(viewport.width/dpr)+'px';canvas.style.height=Math.floor(viewport.height/dpr)+'px';await page.render({canvasContext:ctx,viewport}).promise;loading.hidden=true;currentPage=pageNum;slideCount.textContent=`${currentPage} / ${totalPages}`;progressBar.style.width=`${(currentPage/totalPages)*100}%`;updateDrawerState();rendering=false;if(queuedPage){const next=queuedPage;queuedPage=null;renderPage(next)}}function go(dir){if(!pdfDoc)return;const next=Math.max(1,Math.min(totalPages,currentPage+dir));if(next!==currentPage)renderPage(next);resetIdle()}function toggleFullscreen(){if(!document.fullscreenElement){viewer.requestFullscreen?.()}else{document.exitFullscreen?.()}}document.addEventListener('fullscreenchange',()=>{viewer.classList.toggle('fullscreen-active',!!document.fullscreenElement);resetIdle()});document.addEventListener('keydown',e=>{if(!viewer.classList.contains('active'))return;if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();go(1)}if(e.key==='ArrowLeft'){e.preventDefault();go(-1)}if(e.key.toLowerCase()==='c')openDrawer();if(e.key==='Escape')closeDrawer()});let touchX=0;viewer.addEventListener('touchstart',e=>{touchX=e.changedTouches[0].clientX;resetIdle()},{passive:true});viewer.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-touchX;if(Math.abs(dx)>48)go(dx<0?1:-1)},{passive:true});viewer.addEventListener('mousemove',resetIdle);viewer.addEventListener('click',resetIdle);window.addEventListener('resize',()=>{if(pdfDoc&&viewer.classList.contains('active'))renderPage(currentPage)});function resetIdle(){viewer.classList.remove('idle');clearTimeout(idleTimer);idleTimer=setTimeout(()=>{if(document.fullscreenElement)viewer.classList.add('idle')},2200)}function maybeShowRotateTip(){const isMobile=matchMedia('(max-width: 800px)').matches;const portrait=window.innerHeight>window.innerWidth;if(isMobile&&portrait){rotateTip.classList.add('show');setTimeout(()=>rotateTip.classList.remove('show'),3600)}}setTimeout(()=>loadPdf().catch(()=>{}),600);
</script>
</body>
</html>
