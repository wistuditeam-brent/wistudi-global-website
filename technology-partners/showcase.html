<style>

</head>
<body>

(()=>{

}catch(e){}
const stage=document.getElementById('stage'),scroller=document.getElementById('scroll'),track=document.getElementById('track'),hotspots=document.getElementById('hotspots'),cards=document.getElementById('cards'),svg=document.getElementById('connectors'),warning=document.getElementById('warning'),videos=[...document.querySelectorAll('video')];
const points=[
{id:'author',x:18,y:8.2,color:'#F59E0B',title:'Create the content layer',description:'Author video, text, media and structured learning content directly in Wistudi — all inside one continuous Flow.'},
{id:'interaction',x:20,y:32.8,color:'#8B5CF6',title:'Build interaction into the Flow',description:'Add native activities, questions and assessment without breaking the learning sequence or sending learners elsewhere.'},
{id:'compose',x:18,y:45.4,color:'#22C55E',title:'Compose the right tools together',description:'Place collaborative, creative and interactive tools exactly where they support the learning — while Wistudi keeps the surrounding content, sequence and structure unified.'},
{id:'partners',x:18,y:58.3,color:'#0EA5A4',title:'Bring in specialist technology',description:'Partner tools can become part of the same learning experience through LTI, API or secure embedding.'},
{id:'continuous',x:20,y:81.7,color:'#3B82F6',title:'One continuous experience',description:'Learners move between Wistudi content and specialist partner experiences without leaving the learning journey.'},
{id:'publish',x:18,y:93.3,color:'#F97360',title:'Publish the complete experience',description:'Turn the finished Flow into a reusable lesson, course, curriculum or resource — ready to deliver independently or connect into an LMS.'}
];
const mq=matchMedia('(max-width:700px)'),coarse=matchMedia('(hover:none),(pointer:coarse)'),reduced=matchMedia('(prefers-reduced-motion:reduce)').matches;

function mobile(){return mq.matches} function speed(){return mobile()?34:46} function ready(){return videos.length&&videos.every(v=>v.readyState>=2)} function tellReady(){if(ready())parent.postMessage({type:'wistudi-showcase-ready'},'*')}
videos.forEach(v=>{v.addEventListener('loadeddata',()=>{loaded++;warning.classList.remove('show');v.play().catch(()=>{});tellReady();schedule(false)},{once:true});v.addEventListener('error',()=>{failed++;if(!loaded&&failed===videos.length)warning.classList.add('show')},{once:true})});setTimeout(()=>{if(!loaded&&failed===videos.length)warning.classList.add('show');tellReady()},6000);

function pointPos(p){const sr=stage.getBoundingClientRect(),vr=scroller.getBoundingClientRect();return{x:vr.left-sr.left+(p.x/100)*track.clientWidth,y:vr.top-sr.top+(p.y/100)*track.clientHeight-scroller.scrollTop}}
function draw(p){const c=cards.querySelector(`.card[data-id="${p.id}"]`),path=svg.querySelector(`.path[data-id="${p.id}"]`);if(!c||!path)return;const pos=pointPos(p),sr=stage.getBoundingClientRect();if(mobile()){const h=c.offsetHeight||150,top=Math.max(14,stage.clientHeight-h-18);c.style.left='50%';c.style.top=top+'px';c.style.transform='translateX(-50%)';const cr=c.getBoundingClientRect(),sx=cr.left-sr.left+cr.width*.72,sy=cr.top-sr.top,ex=pos.x,ey=pos.y,elbowY=Math.min(sy-20,ey+Math.max(24,(sy-ey)*.5));path.setAttribute('d',`M ${sx} ${sy} V ${elbowY} H ${ex} V ${ey}`)}else{const h=c.offsetHeight||170,margin=22,top=Math.max(margin,Math.min(stage.clientHeight-h-margin,pos.y-h/2));c.style.left='calc(100% - var(--showcase-w) - (var(--card-w) * .70))';c.style.top=top+'px';c.style.transform='';const cr=c.getBoundingClientRect(),sx=cr.right-sr.left,sy=cr.top-sr.top+cr.height*.38,ex=pos.x,ey=pos.y,elbow=sx+Math.max(34,(ex-sx)*.48);path.setAttribute('d',`M ${sx} ${sy} H ${elbow} V ${ey} H ${ex}`)}}

scroller.addEventListener('scroll',()=>schedule(true),{passive:true});stage.addEventListener('pointerenter',()=>{if(!coarse.matches)hovering=true});stage.addEventListener('pointerleave',()=>{hovering=false;lastFrame=performance.now()});const pauseTouch=()=>touchPauseUntil=performance.now()+5500;scroller.addEventListener('touchstart',pauseTouch,{passive:true});scroller.addEventListener('touchmove',pauseTouch,{passive:true});scroller.addEventListener('touchend',pauseTouch,{passive:true});mq.addEventListener?.('change',()=>schedule(true));window.addEventListener('resize',()=>schedule(false),{passive:true});window.addEventListener('orientationchange',()=>setTimeout(()=>schedule(true),120),{passive:true});document.addEventListener('visibilitychange',()=>lastFrame=performance.now());document.addEventListener('click',e=>{if(openId&&!e.target.closest('.card')&&!e.target.closest('.hotspot')){dismissed=openId;openId=null;update(false)}});render();requestAnimationFrame(tick)
})();
</script>
