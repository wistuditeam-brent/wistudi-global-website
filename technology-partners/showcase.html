<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wistudi learning experience showcase</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--showcase-w:68%;--card-w:310px;--radius:26px}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.stage{position:relative;width:100%;height:100%;min-height:620px;overflow:hidden;isolation:isolate}
.stage::before{content:"";position:absolute;z-index:0;right:-10%;top:3%;width:82%;height:94%;pointer-events:none;background:radial-gradient(circle at 67% 26%,rgba(157,110,255,.36),transparent 32%),radial-gradient(circle at 55% 60%,rgba(112,54,235,.28),transparent 42%),radial-gradient(circle at 73% 76%,rgba(249,115,22,.19),transparent 28%);filter:blur(30px);opacity:.96}
.stage::after{content:"";position:absolute;z-index:1;right:-9%;top:49%;width:74%;height:76%;border-radius:50%;transform:translateY(-50%) rotate(-11deg);pointer-events:none;background:conic-gradient(from 22deg,transparent 0 8%,rgba(179,139,255,.18) 13%,#9f72ff 23%,#6d28d9 34%,transparent 46%,rgba(255,176,111,.22) 55%,#fb923c 66%,#f97316 72%,transparent 83%,rgba(154,109,255,.22) 92%,transparent 100%);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px));mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px));filter:drop-shadow(0 0 15px rgba(139,92,246,.95)) drop-shadow(0 0 34px rgba(124,58,237,.62)) drop-shadow(0 0 14px rgba(249,115,22,.45));opacity:.8}
.shell{position:absolute;z-index:3;right:0;top:0;width:var(--showcase-w);height:100%}
.showcase{position:relative;width:100%;height:100%;overflow:hidden;border:1px solid rgba(255,255,255,.18);border-radius:var(--radius);background:#fff;box-shadow:0 32px 88px rgba(8,7,24,.40),0 0 46px rgba(124,58,237,.18);isolation:isolate}
.scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-width:none;background:#fff}
.scroll::-webkit-scrollbar{display:none}
.track{position:relative;width:100%;font-size:0;line-height:0;background:#fff}
.flow-video{display:block;width:100%;height:auto;margin:0;border:0;background:#fff;object-fit:contain;pointer-events:none}
.hotspots{position:absolute;inset:0;z-index:10;pointer-events:none}
.hotspot{--point:#7a4ee8;position:absolute;width:46px;height:46px;border:0;border-radius:50%;background:var(--point);color:#fff;display:grid;place-items:center;transform:translate(-50%,-50%) scale(.88);opacity:0;pointer-events:none;box-shadow:0 0 0 5px rgba(255,255,255,.94),0 0 0 10px color-mix(in srgb,var(--point) 18%,transparent),0 14px 30px color-mix(in srgb,var(--point) 40%,rgba(20,27,56,.28));transition:opacity .36s ease,transform .4s cubic-bezier(.2,.8,.2,1)}
.hotspot:before{content:"";position:absolute;inset:-11px;border-radius:50%;border:2px solid var(--point);opacity:.42;animation:pulse 2.25s ease-out infinite}
.hotspot:after{content:"";width:13px;height:13px;border-radius:50%;background:#fff;box-shadow:0 0 0 5px rgba(255,255,255,.18)}
.hotspot.in-view{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.hotspot.active{transform:translate(-50%,-50%) scale(1.07);box-shadow:0 0 0 5px rgba(255,255,255,.96),0 0 0 13px color-mix(in srgb,var(--point) 26%,transparent),0 18px 42px color-mix(in srgb,var(--point) 52%,rgba(20,27,56,.32))}
.cards{position:absolute;inset:0;z-index:7;pointer-events:none;overflow:hidden}
.card{--point:#7a4ee8;position:absolute;width:var(--card-w);min-height:148px;left:calc(100% - var(--showcase-w) - (var(--card-w) * .70));overflow:hidden;background:linear-gradient(145deg,color-mix(in srgb,var(--point) 10%,#fff) 0%,rgba(255,255,255,.99) 42%,#fbf8ff 100%);border:1px solid color-mix(in srgb,var(--point) 25%,#e3dfef);border-left:4px solid var(--point);border-radius:22px;box-shadow:0 28px 70px rgba(14,12,38,.34),0 0 0 1px rgba(150,110,255,.12),0 0 46px rgba(139,92,246,.30),0 0 82px rgba(124,58,237,.16);opacity:0;transform:translateY(12px) scale(.90);transform-origin:76% 52%;pointer-events:none;transition:opacity .24s ease,transform .3s ease,filter .3s ease;filter:saturate(.98)}
.card::before{content:"";position:absolute;inset:-70px auto auto -65px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--point) 18%,transparent),transparent 68%);pointer-events:none}
.card.open{opacity:1;pointer-events:auto;animation:cardPop .64s cubic-bezier(.18,.9,.28,1.18) both;filter:saturate(1.05)}
.close{position:absolute;z-index:2;top:12px;right:12px;width:32px;height:32px;border:0;border-radius:11px;background:rgba(244,242,249,.95);color:#646b7c;display:grid;place-items:center;font:600 22px/1 Nunito,Inter,sans-serif;cursor:pointer;box-shadow:0 3px 12px rgba(49,34,84,.08)}
.content{position:relative;z-index:1;padding:26px 50px 26px 24px}
.title{margin:0 0 9px;color:#202541;font-family:Nunito,Inter,sans-serif;font-size:23px;line-height:1.12;font-weight:900;letter-spacing:-.025em}
.desc{margin:0;color:#5b6479;font-family:Nunito,Inter,sans-serif;font-size:16px;line-height:1.53;font-weight:600}
.connectors{position:absolute;inset:0;width:100%;height:100%;overflow:hidden;z-index:6;pointer-events:none}
.path{fill:none;stroke:var(--point,#7a4ee8);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;opacity:0;filter:drop-shadow(0 2px 5px rgba(91,55,160,.28));transition:opacity .22s ease}
.path.visible{opacity:.92}
.warning{display:none;position:absolute;inset:20px;z-index:80;place-items:center;text-align:center;padding:24px;border-radius:18px;background:#fff;color:#26304b;font-size:14px}.warning.show{display:grid}
@keyframes pulse{0%{transform:scale(.78);opacity:.44}70%,100%{transform:scale(1.55);opacity:0}}
@keyframes cardPop{0%{opacity:0;transform:translateY(15px) scale(.76) rotate(-1.2deg)}58%{opacity:1;transform:translateY(-5px) scale(1.045) rotate(.35deg)}78%{transform:translateY(2px) scale(.985) rotate(0)}100%{opacity:1;transform:translateY(0) scale(1) rotate(0)}}
@media(max-width:700px){:root{--showcase-w:100%;--card-w:320px;--radius:20px}.stage{min-height:560px}.stage::after{width:110%;height:74%;right:-40%;opacity:.55}.shell{left:0;right:auto}.card{left:14px;width:calc(100% - 28px);min-height:0}.title{font-size:21px}.desc{font-size:15px}.content{padding:24px 50px 24px 22px}}
@media(prefers-reduced-motion:reduce){.hotspot:before{animation:none}.hotspot,.card,.path{transition:none}.card.open{animation:none;transform:none}}
</style>
</head>
<body>
<div class="stage" id="stage">
  <main class="shell"><section class="showcase" aria-label="Wistudi continuous learning experience showcase"><div class="scroll" id="scroll" tabindex="0" aria-label="Scrollable Wistudi Flow"><div class="track" id="track">
    <video class="flow-video" muted autoplay loop playsinline preload="auto" src="/assets/video/technology-partners/flow-top-1.mp4"></video>
    <video class="flow-video" muted autoplay loop playsinline preload="auto" src="/assets/video/technology-partners/flow-top-2.mp4"></video>
    <video class="flow-video" muted autoplay loop playsinline preload="auto" src="/assets/video/technology-partners/flow-top-3.mp4"></video>
    <video class="flow-video" muted autoplay loop playsinline preload="auto" src="/assets/video/technology-partners/flow-top-4.mp4"></video>
    <video class="flow-video" muted autoplay loop playsinline preload="auto" src="/assets/video/technology-partners/flow-bottom.mp4"></video>
    <div class="hotspots" id="hotspots"></div>
  </div></div><div class="warning" id="warning">The showcase media could not be loaded.</div></section></main>
  <svg class="connectors" id="connectors" aria-hidden="true"></svg><div class="cards" id="cards"></div>
</div>
<script>
(()=>{
try{if(window.frameElement){window.frameElement.style.width='100%';window.frameElement.style.maxWidth='100%';window.frameElement.style.right='0';window.frameElement.style.left='auto'}}catch(e){}
const stage=document.getElementById('stage'),scroller=document.getElementById('scroll'),track=document.getElementById('track'),hotspots=document.getElementById('hotspots'),cards=document.getElementById('cards'),svg=document.getElementById('connectors'),warning=document.getElementById('warning'),videos=[...document.querySelectorAll('video')];
const points=[
{id:'author',x:18,y:8.2,color:'#F59E0B',title:'Create the content layer',description:'Author video, text, media and structured learning content directly in Wistudi — all inside one continuous Flow.'},
{id:'interaction',x:20,y:32.8,color:'#8B5CF6',title:'Build interaction into the Flow',description:'Add native activities, questions and assessment without breaking the learning sequence or sending learners elsewhere.'},
{id:'compose',x:18,y:45.4,color:'#22C55E',title:'Compose the right tools together',description:'Place collaborative, creative and interactive tools exactly where they support the learning — while Wistudi keeps the surrounding content, sequence and structure unified.'},
{id:'partners',x:18,y:58.3,color:'#0EA5A4',title:'Bring in specialist technology',description:'Partner tools can become part of the same learning experience through LTI, API or secure embedding.'},
{id:'continuous',x:20,y:81.7,color:'#3B82F6',title:'One continuous experience',description:'Learners move between Wistudi content and specialist partner experiences without leaving the learning journey.'},
{id:'publish',x:18,y:93.3,color:'#F97360',title:'Publish the complete experience',description:'Turn the finished Flow into a reusable lesson, course, curriculum or resource — ready to deliver independently or connect into an LMS.'}
];
let openId=null,dismissed=null,lastAuto=null,layoutRaf=0,loaded=0,failed=0,hovering=false,touchPauseUntil=0,lastFrame=performance.now(),resetAt=0;
const speed=46,reduced=matchMedia('(prefers-reduced-motion:reduce)').matches;
function ready(){return videos.length&&videos.every(v=>v.readyState>=2)}
function tellReady(){if(ready())parent.postMessage({type:'wistudi-showcase-ready'},'*')}
videos.forEach(v=>{v.addEventListener('loadeddata',()=>{loaded++;warning.classList.remove('show');v.play().catch(()=>{});tellReady();schedule(false)},{once:true});v.addEventListener('error',()=>{failed++;if(!loaded&&failed===videos.length)warning.classList.add('show')},{once:true})});
setTimeout(()=>{if(!loaded&&failed===videos.length)warning.classList.add('show');tellReady()},6000);
function render(){points.forEach(p=>{const b=document.createElement('button');b.type='button';b.className='hotspot';b.dataset.id=p.id;b.style.cssText=`left:${p.x}%;top:${p.y}%;--point:${p.color}`;b.setAttribute('aria-label',p.title);b.setAttribute('aria-expanded','false');hotspots.appendChild(b);const c=document.createElement('section');c.className='card';c.dataset.id=p.id;c.style.setProperty('--point',p.color);c.innerHTML=`<button class="close" type="button" aria-label="Close">×</button><div class="content"><h3 class="title"></h3><p class="desc"></p></div>`;c.querySelector('.title').textContent=p.title;c.querySelector('.desc').textContent=p.description;cards.appendChild(c);const path=document.createElementNS('http://www.w3.org/2000/svg','path');path.classList.add('path');path.dataset.id=p.id;path.style.setProperty('--point',p.color);svg.appendChild(path);b.addEventListener('click',e=>{e.stopPropagation();if(openId===p.id){dismissed=p.id;openId=null}else{dismissed=null;openId=p.id}update(false)});c.querySelector('.close').addEventListener('click',e=>{e.stopPropagation();dismissed=p.id;openId=null;update(false)})});schedule(true)}
function pointPos(p){const sr=stage.getBoundingClientRect(),vr=scroller.getBoundingClientRect();return{x:vr.left-sr.left+(p.x/100)*track.clientWidth,y:vr.top-sr.top+(p.y/100)*track.clientHeight-scroller.scrollTop}}
function draw(p){const c=cards.querySelector(`.card[data-id="${p.id}"]`),path=svg.querySelector(`.path[data-id="${p.id}"]`);if(!c||!path)return;const pos=pointPos(p),h=c.offsetHeight||170,margin=22;let top=Math.max(margin,Math.min(stage.clientHeight-h-margin,pos.y-h/2));c.style.top=top+'px';const sr=stage.getBoundingClientRect(),cr=c.getBoundingClientRect(),sx=cr.right-sr.left,sy=cr.top-sr.top+cr.height*.38,ex=pos.x,ey=pos.y,elbow=sx+Math.max(34,(ex-sx)*.48);path.setAttribute('d',`M ${sx} ${sy} H ${elbow} V ${ey} H ${ex}`)}
function update(auto=true){
  const top=scroller.scrollTop,bottom=top+scroller.clientHeight,centre=top+scroller.clientHeight/2;
  const modalSafeTop=Math.max(145,scroller.clientHeight*.18),modalSafeBottom=Math.max(115,scroller.clientHeight*.14);
  const visible=points.map(p=>({p,y:p.y/100*track.clientHeight})).filter(o=>o.y>=top+modalSafeTop&&o.y<=bottom-modalSafeBottom);
  if(auto){const candidate=visible.reduce((best,o)=>!best||Math.abs(o.y-centre)<Math.abs(best.y-centre)?o:best,null),id=candidate?.p.id||null;if(id!==lastAuto){lastAuto=id;dismissed=null;openId=id}else if(id&&dismissed!==id)openId=id;else if(!id)openId=null}
  points.forEach(p=>{const y=p.y/100*track.clientHeight,screenY=y-top,inView=screenY>=42&&screenY<=scroller.clientHeight-42,inModalZone=screenY>=modalSafeTop&&screenY<=scroller.clientHeight-modalSafeBottom,b=hotspots.querySelector(`.hotspot[data-id="${p.id}"]`),c=cards.querySelector(`.card[data-id="${p.id}"]`),path=svg.querySelector(`.path[data-id="${p.id}"]`),isOpen=openId===p.id&&inModalZone&&dismissed!==p.id;b?.classList.toggle('in-view',inView);b?.classList.toggle('active',isOpen);b?.setAttribute('aria-expanded',isOpen?'true':'false');c?.classList.toggle('open',isOpen);path?.classList.toggle('visible',isOpen);if(isOpen)draw(p)})
}
function schedule(auto=true){cancelAnimationFrame(layoutRaf);layoutRaf=requestAnimationFrame(()=>{svg.setAttribute('viewBox',`0 0 ${stage.clientWidth} ${stage.clientHeight}`);svg.setAttribute('preserveAspectRatio','none');update(auto)})}
function tick(now){const dt=Math.min(.05,(now-lastFrame)/1000);lastFrame=now;const max=Math.max(0,scroller.scrollHeight-scroller.clientHeight),paused=reduced||hovering||document.hidden||now<touchPauseUntil||!ready();if(!paused&&max>0){if(scroller.scrollTop>=max-2){if(!resetAt)resetAt=now+1400;if(now>=resetAt){scroller.scrollTop=0;resetAt=0}}else{resetAt=0;scroller.scrollTop=Math.min(max,scroller.scrollTop+speed*dt)}}requestAnimationFrame(tick)}
scroller.addEventListener('scroll',()=>schedule(true),{passive:true});
stage.addEventListener('pointerenter',()=>hovering=true);stage.addEventListener('pointerleave',()=>{hovering=false;lastFrame=performance.now()});
scroller.addEventListener('touchstart',()=>touchPauseUntil=performance.now()+4500,{passive:true});scroller.addEventListener('touchmove',()=>touchPauseUntil=performance.now()+4500,{passive:true});
window.addEventListener('resize',()=>schedule(false));document.addEventListener('visibilitychange',()=>lastFrame=performance.now());document.addEventListener('click',e=>{if(openId&&!e.target.closest('.card')&&!e.target.closest('.hotspot')){dismissed=openId;openId=null;update(false)}});
render();requestAnimationFrame(tick)
})();
</script>
</body>
</html>
