name: Finalize uploaded Expo images

on:
  push:
    branches:
      - integration/resources-merge-no-deploy
    paths:
      - '.github/workflows/finalize-expo-images.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/resources-merge-no-deploy
          fetch-depth: 0

      - name: Rename supplied images and update Resources article
        shell: bash
        run: |
          set -euo pipefail
          IMG='assets/images/resources/expo-2026'

          test -f "$IMG/ChatGPT Image Aug 29, 2026, 07_18_42 PM (1).png"
          test -f "$IMG/ChatGPT Image Aug 29, 2026, 07_18_42 PM (2).png"
          test -f "$IMG/ChatGPT Image Aug 29, 2026, 07_18_42 PM (3).png"
          test -f "$IMG/ChatGPT Image Aug 29, 2026, 07_18_42 PM (4).png"

          rm -f "$IMG/expo-hero.webp" "$IMG/expo-demo-01.webp" "$IMG/expo-team-banner.webp"
          mv "$IMG/ChatGPT Image Aug 29, 2026, 07_18_42 PM (1).png" "$IMG/expo-hero.png"
          mv "$IMG/ChatGPT Image Aug 29, 2026, 07_18_42 PM (2).png" "$IMG/expo-demo-01.png"
          mv "$IMG/ChatGPT Image Aug 29, 2026, 07_18_42 PM (3).png" "$IMG/expo-demo-02.png"
          mv "$IMG/ChatGPT Image Aug 29, 2026, 07_18_42 PM (4).png" "$IMG/expo-demo-03.png"

          python - <<'PY'
          from pathlib import Path
          import json

          root = Path('.')
          home = root / 'resources/index.html'
          article = root / 'resources/community-notes/wistudi-at-vietnam-edtech-expo-2026/index.html'
          manifest = root / 'assets/data/resources-manifest.json'

          text = home.read_text(encoding='utf-8')
          text = text.replace('/assets/images/resources/expo-2026/expo-hero.webp', '/assets/images/resources/expo-2026/expo-hero.png')
          text = text.replace('/assets/images/resources/expo-2026/expo-demo-01.webp', '/assets/images/resources/expo-2026/expo-demo-01.png')
          text = text.replace('src="/assets/images/resources/expo-2026/expo-hero.png" alt=', 'src="/assets/images/resources/expo-2026/expo-hero.png" width="1536" height="1024" decoding="async" alt=')
          text = text.replace('src="/assets/images/resources/expo-2026/expo-demo-01.png" alt=', 'src="/assets/images/resources/expo-2026/expo-demo-01.png" width="1536" height="1024" decoding="async" alt=')
          home.write_text(text, encoding='utf-8')

          text = article.read_text(encoding='utf-8')
          text = text.replace('/assets/images/resources/expo-2026/expo-hero.webp', '/assets/images/resources/expo-2026/expo-hero.png')
          text = text.replace('/assets/images/resources/expo-2026/expo-demo-01.webp', '/assets/images/resources/expo-2026/expo-demo-01.png')
          text = text.replace('/assets/images/resources/expo-2026/expo-team-banner.webp', '/assets/images/resources/expo-2026/expo-demo-03.png')

          # Structured data: include all four supplied photographs.
          text = text.replace(
              'expo-demo-01.png","https://global.wistudi.com/assets/images/resources/expo-2026/expo-demo-03.png',
              'expo-demo-01.png","https://global.wistudi.com/assets/images/resources/expo-2026/expo-demo-02.png","https://global.wistudi.com/assets/images/resources/expo-2026/expo-demo-03.png'
          )

          # Add the third supplied photograph into the article body once.
          marker = '<h2 id="edtech-connections">Connecting with the wider EdTech community</h2>'
          figure = '<figure class="res-inline-media"><img src="/assets/images/resources/expo-2026/expo-demo-02.png" width="1536" height="1024" decoding="async" alt="Visitors watching a live Wistudi demonstration at Vietnam EdTech Expo 2026" loading="lazy"><figcaption>Visitors explored Wistudi through live demonstrations and conversations around practical teaching and publishing use cases.</figcaption></figure>\n'
          if 'expo-demo-02.png' not in text.split('<section class="res-gallery"')[0]:
              text = text.replace(marker, figure + marker)

          # Give the supplied images intrinsic dimensions to prevent layout shift.
          for name in ['expo-hero.png','expo-demo-01.png','expo-demo-03.png']:
              text = text.replace(f'src="/assets/images/resources/expo-2026/{name}" alt=', f'src="/assets/images/resources/expo-2026/{name}" width="1536" height="1024" decoding="async" alt=')

          # Add all four photos to the lightbox gallery once.
          gallery_marker = '<button class="res-gallery-btn" type="button" data-res-lightbox data-full="/assets/images/resources/expo-2026/expo-demo-03.png">'
          gallery_button = '<button class="res-gallery-btn" type="button" data-res-lightbox data-full="/assets/images/resources/expo-2026/expo-demo-02.png"><img src="/assets/images/resources/expo-2026/expo-demo-02.png" width="1536" height="1024" decoding="async" alt="Visitors watching a live Wistudi demonstration" loading="lazy"></button>'
          gallery_section = text.split('<section class="res-gallery"', 1)[1] if '<section class="res-gallery"' in text else ''
          if 'data-full="/assets/images/resources/expo-2026/expo-demo-02.png"' not in gallery_section:
              text = text.replace(gallery_marker, gallery_button + gallery_marker)

          article.write_text(text, encoding='utf-8')

          data = json.loads(manifest.read_text(encoding='utf-8'))
          a = data['articles'][0]
          a['status'] = 'published'
          a['qa'] = {
              'state': 'pending',
              'reason': 'Original high-resolution Expo images supplied and inserted; awaiting automated static/browser QA on this commit.'
          }
          a['heroImage'] = '/assets/images/resources/expo-2026/expo-hero.png'
          a['media'] = [
              {'src':'/assets/images/resources/expo-2026/expo-hero.png','alt':'Visitors and Wistudi team members gathered around the Wistudi booth at Vietnam EdTech Expo 2026'},
              {'src':'/assets/images/resources/expo-2026/expo-demo-01.png','alt':'A live Wistudi demonstration with an attendee at Vietnam EdTech Expo 2026'},
              {'src':'/assets/images/resources/expo-2026/expo-demo-02.png','alt':'Visitors watching a live Wistudi demonstration at Vietnam EdTech Expo 2026'},
              {'src':'/assets/images/resources/expo-2026/expo-demo-03.png','alt':'A Wistudi team member demonstrating the platform to an Expo visitor'}
          ]
          manifest.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

          rm -rf .asset-import .asset-import-v2
          rm -f .github/workflows/import-expo-images.yml
          rm -f .github/workflows/finalize-expo-images.yml

          git config user.name 'Wistudi Website QA'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Use supplied high-resolution Expo images'
          git push origin HEAD:integration/resources-merge-no-deploy
