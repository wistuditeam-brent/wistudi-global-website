name: Apply Resources Localization Patch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/resources-localization-article-language
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply localization patch
        run: node scripts/apply_resources_localization_patch.mjs
      - name: Validate patched JavaScript and JSON
        run: |
          node --check assets/js/i18n.js
          node --check assets/js/resources-global.js
          node --check assets/js/resources-page-shell.js
          node --check assets/js/article-language.js
          node --check functions/_middleware.js
          node --check scripts/resources_localization_qa.mjs
          for f in assets/i18n/*-resources.json assets/data/article-translations/*.json assets/data/resources-manifest.json; do node -e "JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'))" "$f"; done
      - name: Commit integrated localization changes
        run: |
          git config user.name "wistuditeam-brent"
          git config user.email "wistudi.team@gmail.com"
          git add assets/js/i18n.js assets/js/resources-global.js assets/js/resources-page-shell.js assets/data/resources-manifest.json functions/_middleware.js sitemap.xml
          git commit -m "Complete Resources localization and article language support [localization-patch-complete]"
          git push origin HEAD:fix/resources-localization-article-language
