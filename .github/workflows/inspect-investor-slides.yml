name: Inspect investor slides 14-17

on:
  push:
    branches:
      - investor-room
    paths:
      - ".github/workflows/inspect-investor-slides.yml"

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out investor branch
        uses: actions/checkout@v4
        with:
          ref: investor-room
          fetch-depth: 0

      - name: Install poppler
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Extract slides 14-17
        shell: bash
        run: |
          set -euo pipefail
          PDF="investor-room/assets/presentation/investor-partnership-2026-optimized.pdf"
          OUT="investor-room/assets/presentation/slides-14-17.txt"
          pdftotext -f 14 -l 17 -layout "$PDF" "$OUT"
          cat "$OUT"

      - name: Commit extraction
        shell: bash
        run: |
          git config user.name "wistuditeam-brent"
          git config user.email "wistudi.team@gmail.com"
          git add "investor-room/assets/presentation/slides-14-17.txt"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Extract investor slides 14-17 for contents review"
          git push origin HEAD:investor-room
