<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">

<title>Image Gallery | Wistudi Distributor Room</title>
<meta name="theme-color" content="#07080d">
<style>
:root{--bg:#07080d;--panel:#0d0f16;--muted:#9da3b2;--line:rgba(255,255,255,.11);--soft:rgba(255,255,255,.055);--text:#f7f8fb;--orange:#ff6a3d}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{overflow-x:hidden}
a,button{font:inherit}.room-header{position:sticky;top:0;z-index:50;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(14px,2.7vw,34px);border-bottom:1px solid rgba(255,255,255,.09);background:rgba(7,8,13,.94);backdrop-filter:blur(18px)}
.viewer-left,.viewer-controls{display:flex;align-items:center;gap:12px}.viewer-left{min-width:max-content}.viewer-brand{font-weight:800;letter-spacing:-.035em;font-size:1rem;color:#fff;text-decoration:none}.viewer-title{font-size:.82rem;color:var(--muted);margin-left:2px}
.platform-btn{height:38px;display:inline-flex;align-items:center;padding:0 15px;border-radius:999px;text-decoration:none;font-size:.8rem;font-weight:650;background:#fff;color:#0b0c10;border:1px solid rgba(255,255,255,.9);transition:.18s ease}.platform-btn:hover{background:#f3f4f6;transform:translateY(-1px)}
.header-link{height:36px;padding:0 12px;border-radius:999px;display:inline-flex;align-items:center;gap:7px;text-decoration:none;background:rgba(255,255,255,.055);color:rgba(255,255,255,.86);border:1px solid rgba(255,255,255,.13);font-size:.76rem;font-weight:760;white-space:nowrap;transition:.18s ease}.header-link:hover{background:rgba(255,255,255,.11);border-color:rgba(255,255,255,.24);color:#fff}.header-link.active{background:#fff;color:#0b0c10;border-color:#fff}.header-link svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.6}
.icon-btn{width:38px;height:38px;border-radius:999px;display:grid;place-items:center;color:rgba(255,255,255,.82);text-decoration:none;border:1px solid transparent}.icon-btn:hover{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.13);color:#fff}.icon-btn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.7}
.lang-link{min-width:38px;justify-content:center}
.downloads-menu{position:relative}.downloads-menu>summary{list-style:none}.downloads-menu>summary::-webkit-details-marker{display:none}
.downloads-toggle{height:36px;padding:0 12px;border-radius:999px;display:inline-flex;align-items:center;gap:7px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.055);color:rgba(255,255,255,.86);font-size:.76rem;font-weight:750;white-space:nowrap;cursor:pointer;user-select:none;transition:.18s ease}
.downloads-toggle:hover,.downloads-menu[open] .downloads-toggle{background:rgba(255,255,255,.11);border-color:rgba(255,255,255,.24);color:#fff}.downloads-toggle svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.download-caret{font-size:.78rem;opacity:.56;transition:transform .18s ease}.downloads-menu[open] .download-caret{transform:rotate(180deg)}
.downloads-popover{position:absolute;right:0;top:calc(100% + 10px);z-index:80;width:min(390px,calc(100vw - 28px));padding:9px;border:1px solid rgba(255,255,255,.14);border-radius:16px;background:rgba(12,14,21,.98);box-shadow:0 22px 70px rgba(0,0,0,.48);backdrop-filter:blur(20px)}
.downloads-popover-head{display:flex;align-items:center;justify-content:space-between;padding:7px 9px 9px;font-size:.68rem;text-transform:uppercase;letter-spacing:.12em;font-weight:750;color:rgba(255,255,255,.48)}.downloads-popover-head small{font:inherit;letter-spacing:.08em;color:rgba(255,255,255,.34)}
.download-item{display:grid;grid-template-columns:40px minmax(0,1fr) 22px;gap:11px;align-items:center;padding:11px;border-radius:12px;text-decoration:none;color:#fff;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.08);transition:.16s ease}.download-item:hover{background:rgba(255,255,255,.085);border-color:rgba(255,255,255,.16);transform:translateY(-1px)}
.download-file-icon{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:rgba(255,116,23,.14);border:1px solid rgba(255,116,23,.24);color:#ff9a52;font-size:.65rem;font-weight:850;letter-spacing:.04em}.download-copy{min-width:0}.download-copy strong{display:block;font-size:.79rem;line-height:1.32;font-weight:700;letter-spacing:-.012em}.download-copy span{display:block;margin-top:4px;color:rgba(255,255,255,.52);font-size:.68rem;line-height:1.35}.download-arrow{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;color:rgba(255,255,255,.68);font-size:1rem}
@media(max-width:980px){.viewer-title{display:none}.header-link .header-label{display:none}.header-link{width:36px;padding:0;justify-content:center}.viewer-left,.viewer-controls{gap:7px}.platform-btn{height:34px;padding:0 11px;font-size:.72rem}.icon-btn{width:34px;height:34px}.downloads-toggle{width:34px;padding:0;justify-content:center}.download-label,.download-caret{display:none}.downloads-popover{position:fixed;right:10px;top:58px;width:min(390px,calc(100vw - 20px))}}
@media(max-width:620px){.room-header{height:58px;padding:0 10px}.viewer-title{display:none}.website-btn{display:none}.platform-btn{display:none}.viewer-controls{overflow:visible}.lang-link{width:34px}.viewer-brand{font-size:.94rem}}
main{width:min(1320px,calc(100% - 36px));margin:0 auto;padding:clamp(44px,6vw,84px) 0 90px}.eyebrow{text-transform:uppercase;letter-spacing:.16em;font-size:.68rem;font-weight:800;color:#b8bdc8}.hero h1{font-size:clamp(2.5rem,6vw,5.8rem);letter-spacing:-.065em;line-height:.92;margin:12px 0 18px;font-weight:780;max-width:920px}.hero p{margin:0;color:var(--muted);font-size:clamp(1rem,1.5vw,1.18rem);line-height:1.7;max-width:720px}
.category-bar{display:flex;flex-wrap:wrap;gap:10px;margin:38px 0 20px}.category-btn{border:1px solid var(--line);background:transparent;color:#d7dae2;border-radius:999px;padding:11px 16px;cursor:pointer;font-weight:700;font-size:.8rem;transition:.18s ease}.category-btn:hover{background:var(--soft);color:#fff}.category-btn.active{background:#fff;color:#0d0f16;border-color:#fff}
.collection-head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin:24px 0 18px}.collection-head h2{font-size:clamp(1.5rem,2.4vw,2.15rem);margin:0;letter-spacing:-.04em}.collection-head p{margin:6px 0 0;color:var(--muted);font-size:.9rem;max-width:620px}.count{font-size:.76rem;color:#8e94a3;white-space:nowrap}
.gallery-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-flow:dense;gap:12px}.gallery-card{appearance:none;border:0;padding:0;background:#11131b;border-radius:18px;overflow:hidden;position:relative;cursor:zoom-in;aspect-ratio:4/3;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);transition:transform .22s ease,box-shadow .22s ease}.gallery-card.wide{grid-column:span 2;aspect-ratio:16/9}.gallery-card.tall{grid-row:span 2;aspect-ratio:auto;min-height:500px}.gallery-card:hover{transform:translateY(-3px);box-shadow:0 18px 40px rgba(0,0,0,.28),inset 0 0 0 1px rgba(255,255,255,.12)}.gallery-card img{width:100%;height:100%;display:block;object-fit:cover;transition:transform .35s ease}.gallery-card:hover img{transform:scale(1.025)}.gallery-card:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 60%,rgba(0,0,0,.2));pointer-events:none}
.status{min-height:260px;border:1px dashed rgba(255,255,255,.12);border-radius:22px;display:grid;place-items:center;text-align:center;color:var(--muted);padding:36px}.status strong{display:block;color:#fff;margin-bottom:6px}
.lightbox{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;background:rgba(3,4,7,.92);backdrop-filter:blur(14px);padding:clamp(16px,3vw,38px)}.lightbox.open{display:flex}.lightbox-figure{margin:0;max-width:min(1500px,94vw);max-height:92vh;display:flex;flex-direction:column;gap:12px;align-items:center}.lightbox img{max-width:100%;max-height:82vh;object-fit:contain;border-radius:16px;box-shadow:0 30px 100px rgba(0,0,0,.5)}.caption{font-size:.82rem;color:#c6cad4;min-height:20px;text-align:center}.close-btn{position:absolute;right:22px;top:20px;width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.08);color:white;cursor:pointer;font-size:1.45rem;line-height:1;display:grid;place-items:center}.close-btn:hover{background:rgba(255,255,255,.15)}
@media(max-width:1000px){.gallery-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.gallery-card.tall{min-height:420px}}
@media(max-width:720px){.gallery-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.gallery-card,.gallery-card.wide,.gallery-card.tall{grid-column:span 1;grid-row:span 1;aspect-ratio:4/3;min-height:0;border-radius:14px}.collection-head{align-items:start;flex-direction:column}.count{display:none}main{width:min(100% - 24px,1320px);padding-top:38px}}

/* Distributor Room header ordering */
.platform-btn{background:#7c3aed!important;color:#fff!important;border-color:#8b5cf6!important;box-shadow:0 7px 20px rgba(124,58,237,.22)}
.platform-btn:hover{background:#6d28d9!important;color:#fff!important;border-color:#7c3aed!important}
.language-switch{height:36px;padding:0 10px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;gap:7px;text-decoration:none;background:rgba(255,255,255,.055);color:rgba(255,255,255,.9);border:1px solid rgba(255,255,255,.13);font-size:.74rem;font-weight:780;white-space:nowrap;transition:.18s ease}
.language-switch:hover{background:rgba(255,255,255,.11);border-color:rgba(255,255,255,.24);color:#fff}
.language-flag{width:24px;height:16px;border-radius:3px;display:block;box-shadow:0 0 0 1px rgba(255,255,255,.24);overflow:hidden;flex:0 0 auto}
.language-code{line-height:1}
.header-contents-link{order:-20}
.platform-btn{order:20}.language-switch{order:17}.website-btn{order:18}
@media(max-width:980px){.language-switch{width:38px;padding:0}.language-code{display:none}.language-flag{width:23px;height:15px}}
</style>
<link rel="stylesheet" href="/distributor-room/shared/global-header.css?v=20260928-3">
</head>
<body>

<header data-distributor-header data-locale="en" data-section="gallery"></header>
<main class="wdr-page-content">
  <section class="hero">
    <div class="eyebrow">Wistudi Distributor Room</div>
    <h1>Image Gallery</h1>
    <p>Explore events, real moments and visual stories from across the Wistudi ecosystem.</p>
  </section>
  <div class="category-bar" id="categoryBar"></div>
  <section>
    <div class="collection-head">
      <div><h2 id="collectionTitle"></h2><p id="collectionDescription"></p></div>
      <div class="count" id="imageCount"></div>
    </div>
    <div id="galleryState" class="status">Loading images…</div>
    <div class="gallery-grid" id="galleryGrid" hidden></div>
  </section>
</main>
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Image Gallery">
  <button class="close-btn" id="closeLightbox" aria-label="Close" title="Close">×</button>
  <figure class="lightbox-figure">
    <img id="lightboxImage" alt="">
    <figcaption class="caption" id="lightboxCaption"></figcaption>
  </figure>
</div>
<script src="/distributor-room/shared/global-header.js?v=20260928-3"></script>
<script src="/distributor-room/gallery/gallery-manifest.js?v=20260928-1"></script>
<script>
const CATEGORIES=[{"slug":"wistudi-events","label":"Wistudi Events","desc":"Events, workshops and live Wistudi experiences."},{"slug":"real-moments","label":"Real Moments","desc":"Authentic moments from the Wistudi community and activities."}];
const categoryBar=document.getElementById('categoryBar');
const grid=document.getElementById('galleryGrid');
const state=document.getElementById('galleryState');
const titleEl=document.getElementById('collectionTitle');
const descEl=document.getElementById('collectionDescription');
const countEl=document.getElementById('imageCount');
const lightbox=document.getElementById('lightbox');
const lightboxImage=document.getElementById('lightboxImage');
const lightboxCaption=document.getElementById('lightboxCaption');
const params=new URLSearchParams(location.search);
let active=CATEGORIES.some(c=>c.slug===params.get('category'))?params.get('category'):CATEGORIES[0].slug;
function humanise(name){
  let s=String(name||'').replace(/\.[^.]+$/,'').replace(/^\d+[\s._-]*/,'').replace(/[_-]+/g,' ').trim();
  if(!s||/^img(age)?\s*\d*$/i.test(s)) return '';
  return s.replace(/\b\w/g,m=>m.toUpperCase());
}
function renderCategories(){
  categoryBar.innerHTML='';
  CATEGORIES.forEach(cat=>{
    const b=document.createElement('button');b.type='button';b.className='category-btn'+(cat.slug===active?' active':'');b.textContent=cat.label;
    b.addEventListener('click',()=>{if(active===cat.slug)return;active=cat.slug;const u=new URL(location.href);u.searchParams.set('category',active);history.replaceState({},'',u);renderCategories();loadCollection();});
    categoryBar.appendChild(b);
  });
}
function openLightbox(image){
  lightboxImage.src=image.src;lightboxImage.alt=image.title||'';lightboxCaption.textContent=image.title||'';lightbox.classList.add('open');document.body.style.overflow='hidden';document.getElementById('closeLightbox').focus();
}
function closeLightbox(){lightbox.classList.remove('open');lightboxImage.removeAttribute('src');document.body.style.overflow=''}
document.getElementById('closeLightbox').addEventListener('click',closeLightbox);
lightbox.addEventListener('click',e=>{if(e.target===lightbox)closeLightbox()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&lightbox.classList.contains('open'))closeLightbox()});
function manifestImages(category){
  const folder='distributor-room/gallery/images/'+category;
  const names=window.WISTUDI_GALLERY_MANIFEST?.[category]||[];
  return names.map(name=>({name,src:'/'+folder+'/'+encodeURIComponent(name)}));
}
async function loadCollection(){
  const cat=CATEGORIES.find(c=>c.slug===active)||CATEGORIES[0];
  titleEl.textContent=cat.label;descEl.textContent=cat.desc;grid.hidden=true;grid.innerHTML='';state.hidden=false;state.textContent="Loading images…";countEl.textContent='';
  let images=[];
  try{
    const r=await fetch('/api/distributor-room/gallery?category='+encodeURIComponent(active)+'&v=20260928-4',{cache:'no-store',headers:{'Accept':'application/json','Cache-Control':'no-cache'}});
    if(r.ok){const data=await r.json();images=Array.isArray(data.images)?data.images:[]}
  }catch(_){}
  if(!images.length)images=manifestImages(active);
  if(!images.length){state.innerHTML='<div><strong>'+cat.label+'</strong>No images have been added to this collection yet.</div>';return}
  images.forEach((image,i)=>{
    const btn=document.createElement('button');btn.type='button';btn.className='gallery-card';
    if(i%9===0)btn.classList.add('wide');else if(i%11===5)btn.classList.add('tall');
    const img=document.createElement('img');img.src=image.src;img.alt=humanise(image.name)||cat.label;img.loading=i===0?'eager':'lazy';img.fetchPriority=i===0?'high':'auto';img.decoding='async';
    const item={...image,title:humanise(image.name)};btn.appendChild(img);btn.addEventListener('click',()=>openLightbox(item));grid.appendChild(btn);
  });
  countEl.textContent=images.length+' '+"images";
  state.hidden=true;grid.hidden=false;
}

renderCategories();loadCollection();
</script>
</body>
</html>
