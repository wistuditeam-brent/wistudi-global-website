ript')].filter(s=>s!==bootstrap);for(const s of scripts){if(s.src){try{const src=resolveAsset(s.getAttribute('src'));let code=await fetch(src,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('script');return r.text()});const ns=doc.createElement('script');for(const a of s.attributes)if(a.name!=='src')ns.setAttribute(a.name,a.value);ns.textContent=rewriteCode(code);s.replaceWith(ns)}catch(e){s.src=resolveAsset(s.getAttribute('src'))}}else{s.textContent=rewriteCode(s.textContent)}}const guard=doc.createElement('script');guard.textContent=`document.addEventListener('click',function(e){const a=e.target.closest&&e.target.closest('a[href]');if(!a)return;const h=a.href||'';const base=window.__WS_PREVIEW_REPO_BASE;if(h.startsWith(base)){let t=h.slice(base.length),hash='';const i=t.indexOf('#');if(i>=0){hash=t.slice(i);t=t.slice(0,i)}const clean=t.split('?')[0];const htmlLike=clean.endsWith('/')||clean.endsWith('.html')||!clean.split('/').pop().includes('.');if(htmlLike){e.preventDefault();if(t.endsWith('/'))t+='index.html';location.href=${JSON.stringify(location.pathname)}+'?path='+encodeURIComponent(t)+hash}}},true);`;doc.body.appendChild(guard);const meta=doc.createElement('meta');meta.name='robots';meta.content='noindex,nofollow';doc.head.appendChild(meta);document.open();document.write('<!doctype html>\n'+doc.documentElement.outerHTML);document.close()}catch(err){status.textContent='Preview failed: '+err.message;status.hidden=false}})();</script></body></html>
