<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wistudi Branch Preview</title><style>html,body{margin:0;min-height:100%;background:#fff;font-family:Arial,sans-serif}#preview-status{position:fixed;left:12px;bottom:12px;z-index:2147483647;padding:8px 10px;border-radius:10px;background:rgba(24,20,47,.9);color:#fff;font-size:12px;box-shadow:0 6px 20px rgba(0,0,0,.2)}#preview-status[hidden]{display:none}</style></head><body><div id="preview-status">Loading branch preview…</div><script>(async()=>{const owner='wistuditeam-brent',repo='wistudi-global-website',branch='event/communicative-esl-workshop';const repoBase=`https://cdn.jsdelivr.net/gh/${owner}/${repo}@${branch}/`;const rawBase=`https://raw.githubusercontent.com/${owner}/${repo}/${branch}/`;const status=document.getElementById('preview-status');const params=new URLSearchParams(location.search);let path=params.get('path')||'index.html';path=path.replace(/^\/+/, '');if(path.endsWith('/'))path+='index.html';const pageDir=path.includes('/')?path.slice(0,path.lastIndexOf('/')+1):'';const resolveAsset=(u)=>{if(!u||u.startsWith('data:')||u.startsWith('blob:')||u.startsWith('#')||/^https?:\/\//i.test(u)||u.startsWith('mailto:')||u.startsWith('tel:'))return u;if(u.startsWith('/'))return repoBase+u.slice(1);return new URL(u,repoBase+pageDir).href};const isHtmlLike=(u)=>{const clean=u.split('#')[0].split('?')[0];return clean.endsWith('/')||clean.endsWith('.html')||!clean.split('/').pop().includes('.')};const toPreviewHref=(u)=>{if(!u||u.startsWith('#')||u.startsWith('mailto:')||u.startsWith('tel:')||/^https?:\/\//i.test(u))return u;const [base,hash='']=u.split('#');let target;if(base.startsWith('/'))target=base.slice(1);else target=new URL(base||'.',repoBase+pageDir).pathname.split(`/${owner}/${repo}@${branch}/`).pop();if(!target||target==='.')target=path;if(target.endsWith('/'))target+='index.html';return `${location.pathname}?path=${encodeURIComponent(target)}${hash?`#${hash}`:''}`};try{let html=await fetch(repoBase+path+'?v='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Page not found');return r.text()});const parser=new DOMParser();const doc=parser.parseFromString(html,'text/html');doc.querySelectorAll('base').forEach(el=>el.remove());doc.querySelectorAll('link[href]').forEach(el=>{const h=el.getAttribute('href');el.setAttribute('href',resolveAsset(h))});doc.querySelectorAll('img[src],video[src],source[src],iframe[src]').forEach(el=>{el.setAttribute('src',resolveAsset(el.getAttribute('src')))});doc.querySelectorAll('[srcset]').forEach(el=>{const out=el.getAttribute('srcset').split(',').map(part=>{const bits=part.trim().split(/\s+/);bits[0]=resolveAsset(bits[0]);return bits.join(' ')}).join(', ');el.setAttribute('srcset',out)});doc.querySelectorAll('a[href]').forEach(el=>{const h=el.getAttribute('href');if(isHtmlLike(h)&&!/^https?:\/\//i.test(h)&&!h.startsWith('mailto:')&&!h.startsWith('tel:')&&!h.startsWith('#'))el.setAttribute('href',toPreviewHref(h));else if(h&&h.startsWith('/'))el.setAttribute('href',resolveAsset(h))});doc.querySelectorAll('style').forEach(el=>{el.textContent=el.textContent.replace(/url\((['"]?)(\/(?!\/)[^)'"\s]+)\1\)/g,(m,q,u)=>`url(${q}${repoBase+u.slice(1)}${q})`)});doc.querySelectorAll('[style]').forEach(el=>{el.setAttribute('style',el.getAttribute('style').replace(/url\((['"]?)(\/(?!\/)[^)'"\s]+)\1\)/g,(m,q,u)=>`url(${q}${repoBase+u.slice(1)}${q})`))});const scripts=[...doc.querySelectorAll('script')];for(const s of scripts){if(s.src){try{let code=await fetch(s.src+'?v='+Date.now(),{cache:'no-store'}).then(r=>r.text());code=code.replace(/(["'`])\/(assets|resources)\//g,(_,q,root)=>`${q}${repoBase}${root}/`);const ns=doc.createElement('script');for(const a of s.attributes)if(a.name!=='src')ns.setAttribute(a.name,a.value);ns.textContent=code;s.replaceWith(ns)}catch(e){s.src=resolveAsset(s.getAttribute('src'))}}else{s.textContent=s.textContent.replace(/(["'`])\/(assets|resources)\//g,(_,q,root)=>`${q}${repoBase}${root}/`)}}const previewMeta=doc.createElement('meta');previewMeta.name='robots';previewMeta.content='noindex,nofollow';doc.head.appendChild(previewMeta);const serialized='<!doctype html>\n'+doc.documentElement.outerHTML;document.open();document.write(serialized);document.close()}catch(err){status.textContent='Preview failed: '+err.message;status.hidden=false}})();</script></body></html>
